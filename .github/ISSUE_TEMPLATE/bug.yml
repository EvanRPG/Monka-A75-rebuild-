name: 问题反馈 / Bug
description: 软件或键盘表现不对 / Something is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？/ What happened?
      description: 你做了什么，键盘或软件实际怎样。/ What you did, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: 连接方式 / Connection
      options:
        - 数据线 / Cable
        - 2.4G 接收器 / 2.4G receiver
    validations:
      required: true
  - type: dropdown
    id: recovered
    attributes:
      label: 键盘停止响应了吗？/ Did the keyboard stop responding?
      options:
        - 没有 / No
        - 拔插后恢复 / A replug fixed it
        - 用原版驱动「恢复默认」才恢复 / Needed Restore defaults in the original driver
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      description: 设置 → 关于 / Settings → About
      placeholder: "1.0.0"
  - type: textarea
    id: diag
    attributes:
      label: 诊断信息 / Diagnostic report
      description: 找不到键盘时，页面上「生成诊断信息」的结果。/ When the keyboard is not found, paste the diagnostic report.
      render: text
